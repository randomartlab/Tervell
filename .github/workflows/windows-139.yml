name: Windows 探测目录失败堆栈诊断
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/windows-139.yml]
permissions:
  contents: read
concurrency:
  group: tervell-windows-143
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.8
          cache: false
      - name: 固定源码摘要并核验全部文件
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'tervell-source.tar.gz'
          Invoke-WebRequest 'https://randomai.art/downloads/v0.19.143/Tervell-0.19.143-source.tar.gz' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '20a56ea70fce8d46e972a07ccab6ab5901bda2a5c2bdb29f783463f6a552e99e') { throw 'source archive hash mismatch' }
          New-Item -ItemType Directory -Force source | Out-Null
          tar -xzf $archive -C source
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Invoke-WebRequest 'https://randomai.art/downloads/v0.19.143/source-manifest.json' -OutFile source/qa-source-manifest.json
          $manifest = Get-Content source/qa-source-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.archiveSha256 -ne '20a56ea70fce8d46e972a07ccab6ab5901bda2a5c2bdb29f783463f6a552e99e' -or $manifest.version -ne '0.19.143') { throw 'manifest mismatch' }
          foreach ($entry in $manifest.files) {
            if ($entry.path -match '(^/|(^|/)\.\.(/|$)|:)') { throw 'unsafe manifest path' }
            $file = Join-Path source $entry.path
            if ((Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant() -ne $entry.sha256 -or (Get-Item $file).Length -ne $entry.bytes) { throw "source mismatch: $($entry.path)" }
          }
      - name: 固定依赖与安全回归
        working-directory: source
        shell: pwsh
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun run gen:check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun run typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun run --cwd apps/electron build:office-preview
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun test --isolate scripts/light-default.test.ts scripts/official-acp-peer.test.ts scripts/omp-launch-policy.test.ts scripts/omp-admission.test.ts scripts/probe-upgrade-recovery.test.ts scripts/acp-graceful-close.test.ts scripts/gateway-auth.test.ts scripts/managed-cli-retention.test.ts scripts/shared-cli-runtime.test.ts scripts/native-probe-isolation.test.ts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun test scripts/gateway-flat-model.test.ts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: 准备原生运行时及网关
        working-directory: source
        shell: pwsh
        run: |
          node apps/electron/scripts/prepare-windows-assets.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node apps/electron/scripts/build-windows-gateway.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force apps/electron/resources/model-gateway | Out-Null
          Copy-Item vendor/model-gateway/win32-x64/magpie.exe apps/electron/resources/model-gateway/magpie.exe
      - name: 两个失败内核原断言诊断
        working-directory: source
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://randomai.art/downloads/v0.19.143/kernel-route-storage.ts' -OutFile apps/electron/src/main/lib/kernel-route-storage.ts
          Invoke-WebRequest 'https://randomai.art/downloads/v0.19.143/desktop-cli-handshake.ts' -OutFile apps/electron/src/main/lib/desktop-cli-handshake.ts
          if ((Get-FileHash apps/electron/src/main/lib/kernel-route-storage.ts).Hash.ToLowerInvariant() -ne '3952d763f4ec605350f2e26dbac3e4553ec205031157b24f2a2d3767836f53a4') { throw 'storage patch mismatch' }
          if ((Get-FileHash apps/electron/src/main/lib/desktop-cli-handshake.ts).Hash.ToLowerInvariant() -ne 'a8cd17b168c83af59c352d754c7a872a3ded8eee6dbbe148a685bc1995b180e3') { throw 'handshake patch mismatch' }
          Invoke-WebRequest 'https://randomai.art/downloads/v0.19.143/dialogue-diagnostic.ts' -OutFile scripts/verify-managed-kernel-dialogue.ts
          if ((Get-FileHash scripts/verify-managed-kernel-dialogue.ts).Hash.ToLowerInvariant() -ne 'cf791f8ed54546adcf9074286aab3397b20e9b0c0dde0ee85e267d846bdd9d20') { throw 'test hash mismatch' }
          node node_modules/esbuild/bin/esbuild scripts/verify-managed-kernel-dialogue.ts --bundle --platform=node --format=cjs --external:electron --external:sharp --external:esbuild --external:@earendil-works/pi-coding-agent --external:@earendil-works/pi-agent-core --external:@earendil-works/pi-ai --outfile=apps/electron/dist/dialogue.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:TERVELL_QA_NODE_BIN=(Get-Command node.exe).Source
          $env:TERVELL_QA_KERNELS='opencode,crow-cli'
          $env:TERVELL_QA_EVIDENCE_DIR=Join-Path $PWD 'apps/electron/out/windows-alpha/native-smoke'
          $electron=Join-Path $env:USERPROFILE '.cache/tervell/windows-build/electron-win32-x64/electron.exe'
          New-Item -ItemType Directory -Force $env:TERVELL_QA_EVIDENCE_DIR | Out-Null
          & $electron apps/electron/dist/dialogue.cjs 2>&1 | Tee-Object -FilePath apps/electron/out/windows-alpha/native-smoke/diagnostic.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Test-Path apps/electron/out/windows-alpha/native-smoke/dialogue-report.json)) { throw 'no evidence' }
      - name: 保存诊断与精确源码身份
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-143-diagnostics
          path: |
            source/apps/electron/out/windows-alpha/native-smoke/
            source/qa-source-manifest.json
            source/scripts/verify-acp-host-runtime.ts
          retention-days: 14
