name: Windows ACP 0.19.141 流式与取消重试
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/windows-139.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: 精确产品源码与仅增加诊断的测试
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://randomai.art/downloads/v0.19.141/Tervell-0.19.141-source.tar.gz' -OutFile source.tar.gz
          if ((Get-FileHash source.tar.gz).Hash.ToLowerInvariant() -ne 'f3a9a503c6a6d04828ca825bd8d73aff1a5b1433cad97046c493208cab44f30d') { throw 'source hash mismatch' }
          New-Item -ItemType Directory source | Out-Null
          tar -xzf source.tar.gz -C source
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Invoke-WebRequest 'https://randomai.art/downloads/v0.19.141/verify-acp-host-runtime-diagnostic.ts' -OutFile source/scripts/verify-acp-host-runtime.ts
          if ((Get-FileHash source/scripts/verify-acp-host-runtime.ts).Hash.ToLowerInvariant() -ne 'a23e36ffe4cab6a8a98593a1dde6ce3361537a80975e2c99036b88143e7705c7') { throw 'test hash mismatch' }
      - name: 原断言重试
        working-directory: source
        shell: pwsh
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node apps/electron/scripts/prepare-windows-assets.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force apps/electron/dist | Out-Null
          node node_modules/esbuild/bin/esbuild scripts/verify-acp-host-runtime.ts --bundle --platform=node --format=cjs --external:electron --external:sharp --external:esbuild --external:@earendil-works/pi-coding-agent --external:@earendil-works/pi-agent-core --external:@earendil-works/pi-ai --outfile=apps/electron/dist/acp-host-runtime-verify.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:TERVELL_QA_NODE_BIN=(Get-Command node.exe).Source
          $env:TERVELL_QA_EVIDENCE_DIR=Join-Path $PWD 'evidence'
          $electron=Join-Path $env:USERPROFILE '.cache/tervell/windows-build/electron-win32-x64/electron.exe'
          New-Item -ItemType Directory -Force evidence | Out-Null
          & $electron apps/electron/dist/acp-host-runtime-verify.cjs 2>&1 | Tee-Object -FilePath evidence/host.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Test-Path evidence/acp-host-runtime.json)) { throw '缺少真实测试完成证据' }
          if (-not (Get-Content evidence/acp-host-runtime.json -Raw | ConvertFrom-Json).ok) { throw '原断言未通过' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acp-original-assertion-diagnostics
          path: source/evidence/
          if-no-files-found: error
          retention-days: 14
